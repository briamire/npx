<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Request — EC&L Construction Materials</title>
    <meta name="description" content="Review your selected construction materials and request a quote from EC&L.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:   #1E3A2F;
            --accent:    #E07B2A;
            --secondary: #C39B52;
            --dark:      #111827;
            --mid:       #374151;
            --muted:     #6B7280;
            --light:     #F9FAFB;
            --white:     #FFFFFF;
            --border:    rgba(0,0,0,0.08);
            --whatsapp:  #25D366;
            --radius:    14px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.12);
            --text: #374151;
            --hover: #162d24;
            --success: #16a34a;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:'Inter','Segoe UI',sans-serif; background:var(--light); color:var(--dark); overflow-x:hidden; line-height:1.6; }
        a { text-decoration:none; color:inherit; }

        /* ---- HEADER ---- */
        .site-header {
            position:fixed; top:0; left:0; right:0; z-index:1000;
            background:rgba(255,255,255,0.97); backdrop-filter:blur(12px);
            box-shadow:0 2px 20px rgba(0,0,0,0.08);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 2rem; height:70px;
        }
        .logo { font-size:1.6rem; font-weight:900; color:var(--primary); letter-spacing:-1px; }
        .logo span { color:var(--accent); }
        .site-nav { display:flex; align-items:center; gap:0.2rem; }
        .site-nav a { color:var(--mid); font-size:0.88rem; font-weight:600; padding:0.5rem 0.8rem; border-radius:8px; transition:all 0.2s; white-space:nowrap; }
        .site-nav a:hover { color:var(--accent); background:rgba(224,123,42,0.07); }
        .nav-cta { background:var(--accent); color:white !important; padding:0.55rem 1.3rem !important; border-radius:50px !important; font-weight:700 !important; margin-left:0.5rem; box-shadow:0 4px 15px rgba(224,123,42,0.3); }
        .nav-cta:hover { background:#c96b1d !important; transform:translateY(-1px); }
        .hamburger { display:none; cursor:pointer; background:transparent; border:0; padding:0.5rem; }
        .hamburger-box { width:28px; height:22px; display:inline-block; position:relative; }
        .hamburger-inner,.hamburger-inner::before,.hamburger-inner::after { width:100%; height:3px; background:var(--primary); position:absolute; left:0; border-radius:3px; transition:transform 0.25s; }
        .hamburger-inner { top:50%; transform:translateY(-50%); }
        .hamburger-inner::before { content:''; top:-9px; }
        .hamburger-inner::after  { content:''; top: 9px; }
        .hamburger.active .hamburger-inner { background:transparent; }
        .hamburger.active .hamburger-inner::before { transform:translateY(9px) rotate(45deg); }
        .hamburger.active .hamburger-inner::after  { transform:translateY(-9px) rotate(-45deg); }
        @media (max-width:900px) {
            .hamburger { display:block; }
            .site-nav { position:fixed; top:70px; right:-100%; width:280px; height:calc(100vh - 70px); background:white; flex-direction:column; align-items:flex-start; padding:2rem 1.5rem; gap:0.3rem; box-shadow:-5px 0 20px rgba(0,0,0,0.12); transition:right 0.3s ease; z-index:999; overflow-y:auto; }
            .site-nav.active { right:0; }
            .site-nav a { width:100%; padding:0.85rem 1rem; border-bottom:1px solid rgba(0,0,0,0.06); font-size:1rem; border-radius:0; }
            .nav-cta { margin:0.5rem 0 0; width:100%; text-align:center; border-radius:50px !important; }
        }

        /* ---- CART PAGE HERO ---- */
        .cart-hero {
            background:linear-gradient(135deg, var(--primary), #2a5c3f);
            padding:100px 2rem 2.5rem;
            color:white;
            position:relative; overflow:hidden;
        }
        .cart-hero::before { content:''; position:absolute; inset:0; background:url('Images/landing.webp') center/cover no-repeat; opacity:0.08; }
        .cart-hero-inner { max-width:1200px; margin:0 auto; position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .cart-hero h1 { font-size:clamp(1.6rem,3vw,2.2rem); font-weight:800; }
        .cart-hero p { color:rgba(255,255,255,0.7); font-size:0.9rem; margin-top:0.3rem; }
        .back-btn {
            background:rgba(255,255,255,0.12); color:white; border:1px solid rgba(255,255,255,0.3);
            padding:0.6rem 1.4rem; border-radius:50px; cursor:pointer;
            font-size:0.88rem; font-weight:600; font-family:inherit;
            transition:all 0.3s; display:inline-flex; align-items:center; gap:0.5rem;
        }
        .back-btn:hover { background:rgba(255,255,255,0.22); }

        /* ---- CONTAINER ---- */
        .container { max-width:1200px; margin:0 auto; padding:2rem 2rem; }

        .cart-container {
            display:grid; grid-template-columns:2fr 1fr;
            gap:2rem; margin-top:0;
        }

        .cart-items {
            background:white; border-radius:var(--radius);
            padding:2rem; box-shadow:var(--shadow-sm);
            border:1px solid var(--border);
        }
        .cart-items h1 { font-size:1.4rem; font-weight:800; color:var(--dark); margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:2px solid var(--light); }

        .cart-item {
            display:flex; gap:1.2rem;
            padding:1.2rem 0; border-bottom:1px solid var(--light);
            align-items:center;
        }
        .cart-item:last-child { border-bottom:none; }

        .item-image {
            width:110px; height:110px; border-radius:10px;
            object-fit:cover; flex-shrink:0;
            border:2px solid var(--border);
        }
        .item-image-placeholder {
            width:110px; height:110px; border-radius:10px;
            background:linear-gradient(135deg, #e5e7eb, #f3f4f6);
            display:flex; align-items:center; justify-content:center;
            color:var(--muted); font-size:0.82rem; text-align:center;
            flex-shrink:0; border:2px solid var(--border);
        }

        .item-details { flex-grow:1; }
        .item-name { font-size:1rem; font-weight:700; margin-bottom:0.3rem; color:var(--primary); }
        .item-description { color:var(--muted); font-size:0.85rem; margin-bottom:0.5rem; line-height:1.5; }
        .item-price { color:var(--accent); font-weight:700; font-size:1rem; margin-bottom:0.5rem; }

        .quantity-controls { display:flex; align-items:center; gap:0.6rem; margin-top:0.8rem; }
        .quantity-btn {
            width:32px; height:32px;
            border:2px solid var(--primary); border-radius:50%;
            background:transparent; cursor:pointer; color:var(--primary);
            font-weight:700; font-size:1rem; transition:all 0.2s;
            display:flex; align-items:center; justify-content:center;
        }
        .quantity-btn:hover { background:var(--primary); color:white; }
        .quantity-btn:disabled { opacity:0.4; cursor:not-allowed; }
        .quantity-input { width:55px; padding:6px; border:2px solid var(--border); border-radius:8px; text-align:center; font-size:0.95rem; font-family:inherit; outline:none; }
        .quantity-input:focus { border-color:var(--accent); }

        .remove-item {
            background:transparent; color:#dc2626; border:1px solid #fca5a5;
            padding:6px 12px; border-radius:6px; cursor:pointer;
            margin-top:0.6rem; font-size:0.8rem; font-weight:600;
            font-family:inherit; transition:all 0.2s;
        }
        .remove-item:hover { background:#fef2f2; border-color:#dc2626; }

        .item-total { font-size:1.1rem; font-weight:800; color:var(--primary); text-align:right; min-width:90px; }

        /* Summary Panel */
        .cart-summary {
            background:white; padding:1.8rem; border-radius:var(--radius);
            box-shadow:var(--shadow-sm); height:fit-content;
            border:1px solid var(--border); position:sticky; top:90px;
        }
        .cart-summary h2 { font-size:1.2rem; font-weight:800; color:var(--dark); margin-bottom:1.2rem; padding-bottom:0.8rem; border-bottom:2px solid var(--light); }

        .summary-row { display:flex; justify-content:space-between; margin:0.8rem 0; padding:0.6rem 0; border-bottom:1px solid var(--light); font-size:0.93rem; }
        .summary-row:last-child { border-bottom:none; }
        .total { font-weight:800; font-size:1.1rem; color:var(--primary); }

        .checkout-btn {
            width:100%; padding:1rem; background:var(--accent);
            color:white; border:none; border-radius:50px;
            font-size:0.95rem; font-weight:700; cursor:pointer;
            margin-top:1.2rem; font-family:inherit;
            transition:all 0.3s; box-shadow:0 6px 20px rgba(224,123,42,0.3);
        }
        .checkout-btn:hover { background:#c96b1d; transform:translateY(-2px); }
        .checkout-btn:disabled { background:#d1d5db; cursor:not-allowed; transform:none; box-shadow:none; }

        /* Empty cart */
        .empty-cart { text-align:center; padding:4rem 1.5rem; }
        .empty-cart-icon { font-size:4rem; margin-bottom:1rem; }
        .empty-cart h2 { color:var(--primary); font-size:1.4rem; margin-bottom:0.5rem; }
        .empty-cart p { color:var(--muted); margin-bottom:1.5rem; font-size:0.95rem; }
        .continue-shopping {
            background:var(--primary); color:white; border:none;
            padding:0.8rem 1.8rem; border-radius:50px; cursor:pointer;
            font-size:0.92rem; font-weight:700; font-family:inherit;
            transition:all 0.3s;
        }
        .continue-shopping:hover { background:var(--hover); transform:translateY(-2px); }

        /* Notification */
        .notification {
            position:fixed; top:80px; right:1.5rem;
            background:var(--success); color:white;
            padding:1rem 1.5rem; border-radius:10px;
            box-shadow:0 8px 25px rgba(0,0,0,0.15);
            z-index:2000; transform:translateX(420px);
            transition:transform 0.3s ease; font-size:0.9rem; font-weight:600;
        }
        .notification.show { transform:translateX(0); }
        .notification.error { background:#dc2626; }

        /* Coupon */
        .coupon-section { background:var(--light); padding:1.2rem; border-radius:10px; margin-bottom:1.2rem; }
        .coupon-section h3 { font-size:0.88rem; font-weight:700; color:var(--mid); margin-bottom:0.6rem; }
        .coupon-input { display:flex; gap:0.6rem; }
        .coupon-input input { flex:1; padding:0.65rem 0.9rem; border:2px solid var(--border); border-radius:8px; font-size:0.88rem; font-family:inherit; outline:none; }
        .coupon-input input:focus { border-color:var(--accent); }
        .apply-coupon { background:var(--primary); color:white; border:none; padding:0.65rem 1.1rem; border-radius:8px; cursor:pointer; font-size:0.85rem; font-weight:700; font-family:inherit; transition:background 0.2s; }
        .apply-coupon:hover { background:var(--hover); }

        /* WhatsApp float */
        .whatsapp-float { position:fixed; bottom:2rem; right:2rem; z-index:9999; display:flex; align-items:center; gap:0.7rem; }
        .whatsapp-fab { width:55px; height:55px; background:#25D366; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:white; box-shadow:0 6px 25px rgba(37,211,102,0.5); cursor:pointer; transition:all 0.3s; text-decoration:none; }
        .whatsapp-fab:hover { transform:scale(1.1); }

        @media (max-width:768px) {
            .cart-container { grid-template-columns:1fr; }
            .cart-item { flex-direction:column; text-align:center; }
            .item-image, .item-image-placeholder { width:100%; height:180px; }
            .item-total { text-align:center; }
            .quantity-controls { justify-content:center; }
            .container { padding:1.5rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- SITE HEADER -->
    <header class="site-header">
      <div class="logo">EC<span>&</span>L</div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span class="hamburger-box"><span class="hamburger-inner"></span></span>
      </button>
      <nav class="site-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="Products.html">Materials</a>
        <a href="Products.html#gypsum">Gypsum</a>
        <a href="index.html#transport">Transport</a>
        <a href="Services.html">Services</a>
        <a href="about.html">About</a>
        <a href="index.html#quote">Contact</a>
        <a href="index.html#quote" class="nav-cta">GET A QUOTE</a>
      </nav>
    </header>

    <!-- CART PAGE HERO -->
    <div class="cart-hero">
      <div class="cart-hero-inner">
        <div>
          <h1>🛒 Your Quote Request</h1>
          <p>Review selected materials and send your enquiry to EC&L</p>
        </div>
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back to Products</button>
      </div>
    </div>

    <div class="container">
        <div class="cart-container">
            <div class="cart-items">
                <h1>Your Shopping Cart</h1>
                <div class="cart-items-list">
                    <!-- Cart items will be dynamically inserted here -->
                </div>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                
                <div class="coupon-section">
                    <h3>Have a coupon?</h3>
                    <div class="coupon-input">
                        <input type="text" id="coupon-code" placeholder="Enter coupon code">
                        <button class="apply-coupon" onclick="applyCoupon()">Apply</button>
                    </div>
                </div>

                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span class="subtotal">sh 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping:</span>
                    <span class="shipping">sh 0</span>
                </div>
                <div class="summary-row discount-row" style="display: none;">
                    <span>Discount:</span>
                    <span class="discount">-sh 0</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span class="total-amount">sh 0</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <span id="notification-message"></span>
    </div>

    <script>
        // Load cart data from localStorage (integrated with product page)
        let cart = JSON.parse(localStorage.getItem('constructionCart')) || [];
        let discount = parseFloat(localStorage.getItem('cartDiscount')) || 0;
        let couponApplied = localStorage.getItem('couponApplied') === 'true';

        // Save cart to localStorage
        function saveCart() {
            localStorage.setItem('constructionCart', JSON.stringify(cart));
            localStorage.setItem('cartDiscount', discount.toString());
            localStorage.setItem('couponApplied', couponApplied.toString());
        }

        // Show notification
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            const messageElement = document.getElementById('notification-message');
            messageElement.textContent = message;
            
            if (isError) {
                notification.classList.add('error');
            } else {
                notification.classList.remove('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Function to get image from card element or generate placeholder
        function getImageSrc(item) {
            // If item has image property, use it
            if (item.image && item.image.trim() !== '') {
                return item.image;
            }
            
            // If no image, return null to use placeholder
            return null;
        }

        // Function to render image element
        function renderImageElement(item) {
            const imageSrc = getImageSrc(item);
            
            if (imageSrc) {
                return `<img src="${imageSrc}" alt="${item.name}" class="item-image" onerror="this.outerHTML='<div class=\\'item-image-placeholder\\'>No Image<br>Available</div>'">`;
            } else {
                return `<div class="item-image-placeholder">No Image<br>Available</div>`;
            }
        }

        // Update cart display
        function updateCartDisplay() {
            const cartItemsList = document.querySelector('.cart-items-list');
            const subtotalElement = document.querySelector('.subtotal');
            const shippingElement = document.querySelector('.shipping');
            const discountElement = document.querySelector('.discount');
            const discountRow = document.querySelector('.discount-row');
            const totalElement = document.querySelector('.total-amount');
            const checkoutBtn = document.querySelector('.checkout-btn');
            
            if (cart.length === 0) {
                cartItemsList.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Your cart is empty</h2>
                        <p>Looks like you haven't added anything to your cart yet.</p>
                        <button class="continue-shopping" onclick="window.history.back()">
                            Continue Shopping
                        </button>
                    </div>
                `;
                subtotalElement.textContent = 'sh 0';
                shippingElement.textContent = 'sh 0';
                totalElement.textContent = 'sh 0';
                checkoutBtn.disabled = true;
                discountRow.style.display = 'none';
                return;
            }
            
            let cartHTML = '';
            let subtotal = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                cartHTML += `
                    <div class="cart-item">
                        ${renderImageElement(item)}
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-description">${item.description || 'High-quality construction material'}</div>
                            <div class="item-price">sh ${item.price} each</div>
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="updateQuantity('${item.id}', -1)" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="setQuantity('${item.id}', this.value)">
                                <button class="quantity-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                            </div>
                            <button class="remove-item" onclick="removeItem('${item.id}')">Remove from Cart</button>
                        </div>
                        <div class="item-total">
                            sh ${itemTotal.toLocaleString()}
                        </div>
                    </div>
                `;
            });
            
            cartItemsList.innerHTML = cartHTML;
            
            // Calculate shipping (free for orders over 5000, otherwise 200)
            const shipping = subtotal > 5000 ? 0 : 200;
            const finalTotal = subtotal + shipping - discount;
            
            subtotalElement.textContent = `sh ${subtotal.toLocaleString()}`;
            shippingElement.textContent = `sh ${shipping.toLocaleString()}`;
            totalElement.textContent = `sh ${finalTotal.toLocaleString()}`;
            
            if (discount > 0) {
                discountElement.textContent = `-sh ${discount.toLocaleString()}`;
                discountRow.style.display = 'flex';
            } else {
                discountRow.style.display = 'none';
            }
            
            checkoutBtn.disabled = false;
        }

        // Function to add item to cart (called from product page)
        function addToCart(productData) {
            // Ensure all required properties are present
            const item = {
                id: productData.id || Date.now().toString(),
                name: productData.name || 'Unknown Product',
                price: productData.price || 0,
                quantity: productData.quantity || 1,
                description: productData.description || 'High-quality construction material',
                image: productData.image || productData.imageSrc || null
            };
            
            // Check if item already exists in cart
            const existingItem = cart.find(cartItem => cartItem.id === item.id);
            
            if (existingItem) {
                existingItem.quantity += item.quantity;
            } else {
                cart.push(item);
            }
            
            saveCart();
            updateCartDisplay();
            showNotification(`${item.name} added to cart`);
        }

        // Update quantity
        function updateQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeItem(id);
                } else {
                    saveCart();
                    updateCartDisplay();
                    showNotification(`${item.name} quantity updated`);
                }
            }
        }

        // Set quantity directly
        function setQuantity(id, quantity) {
            const item = cart.find(item => item.id === id);
            const newQuantity = parseInt(quantity);
            if (item && newQuantity > 0) {
                item.quantity = newQuantity;
                saveCart();
                updateCartDisplay();
                showNotification(`${item.name} quantity updated`);
            } else if (newQuantity <= 0) {
                removeItem(id);
            }
        }

        // Remove item from cart
        function removeItem(id) {
            const item = cart.find(item => item.id === id);
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartDisplay();
            showNotification(`${item ? item.name : 'Item'} removed from cart`);
        }

        
          

        // Checkout function
        function checkout() {
            if (cart.length === 0) {
                showNotification('Your cart is empty!', true);
                return;
            }
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 5000 ? 0 : 200;
            const finalTotal = subtotal + shipping - discount;
            
            // Create order summary
            let orderSummary = `Order Summary:\n\n`;
            cart.forEach(item => {
                orderSummary += `${item.name} x${item.quantity} - sh ${(item.price * item.quantity).toLocaleString()}\n`;
            });
            orderSummary += `\nSubtotal: sh ${subtotal.toLocaleString()}`;
            orderSummary += `\nShipping: sh ${shipping.toLocaleString()}`;
            if (discount > 0) {
                orderSummary += `\nDiscount: -sh ${discount.toLocaleString()}`;
            }
            orderSummary += `\nTotal: sh ${finalTotal.toLocaleString()}`;
            
            const confirmed = confirm(`${orderSummary}\n\nConfirm your order?`);
            
            if (confirmed) {
                alert('Order placed successfully!\n\nThank you for your purchase!\nYou will receive a confirmation email shortly.');
                
                // Clear cart and localStorage
                cart = [];
                discount = 0;
                couponApplied = false;
                localStorage.removeItem('constructionCart');
                localStorage.removeItem('cartDiscount');
                localStorage.removeItem('couponApplied');
                updateCartDisplay();
                
               
            }
        }

        
            
            
            updateCartDisplay();
        

        // Go back to products page
        function goToProducts() {
            window.location.href = 'Products.html'; // Adjust path as needed
        }

        // Add function to handle back button
        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                goToProducts();
            }
        }

        
         
        // Expose functions to window for integration with product page
        window.addToCart = addToCart;

        // Nav hamburger
        const hamburger = document.getElementById('hamburger');
        const mainNav   = document.getElementById('mainNav');
        if (hamburger && mainNav) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                mainNav.classList.toggle('active');
            });
        }
    </script>

    <script src="coupon_manager.js"></script>
